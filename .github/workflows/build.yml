name: Build and verify Emmy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Acquire Dalamud build references
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'dalamud'
          New-Item -ItemType Directory -Path $path -Force | Out-Null
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile "$path.zip"
          Expand-Archive "$path.zip" -DestinationPath $path
          "DALAMUD_HOME=$path" >> $env:GITHUB_ENV
      - name: Build and package
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser checks
        shell: pwsh
        run: |
          npm ci
          npx playwright install chromium
      - name: Verify API and browser
        shell: pwsh
        run: ./scripts/test-ui.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Emmy-browser-evidence
          path: artifacts/browser
      - uses: actions/upload-artifact@v4
        with:
          name: Emmy-Windows-preview
          path: artifacts/Emmy-preview.zip
